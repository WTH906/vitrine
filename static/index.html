<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Consultant RH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
:root {
    --bg: #0a0b0f;
    --bg-raised: #12131a;
    --bg-card: #161722;
    --fg: #f0f1f4;
    --fg-muted: #8b8fa3;
    --fg-dim: #5c5f73;
    --border: #23253a;
    --accent: #4d8fcc;
    --accent-hover: #5da0dd;
    --accent-muted: rgba(77,143,204,.12);
    --space-xs: 4px;
    --space-sm: 8px;
    --space-md: 24px;
    --space-lg: 32px;
    --space-xl: 48px;
    --space-2xl: 64px;
    --space-3xl: 96px;
    --font-head: 'EB Garamond', Georgia, 'Times New Roman', serif;
    --font-body: 'Lato', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --shadow-modal: 0 16px 48px rgba(0,0,0,.5);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: var(--bg);
    color: var(--fg);
    font: 400 16px/1.65 var(--font-body);
    -webkit-font-smoothing: antialiased;
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0s !important; animation-duration: 0s !important; }
}

/* ── Services banner ── */
.banner {
    background: var(--bg-raised);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
}
.banner-inner {
    display: flex;
    max-width: 960px;
    margin: 0 auto;
}
.service-card {
    flex: 1;
    min-width: 180px;
    padding: var(--space-lg) var(--space-md);
    text-align: center;
    border-right: 1px solid var(--border);
    transition: background 200ms ease;
}
.service-card:last-child { border-right: none; }
.service-card:hover { background: var(--accent-muted); }
.service-card h3 {
    font: 500 15px/1.3 var(--font-body);
    color: var(--fg);
    margin-bottom: var(--space-xs);
    letter-spacing: .01em;
}
.service-card p {
    font-size: 13px;
    color: var(--fg-muted);
    line-height: 1.5;
}

/* ── Hero ── */
.hero {
    max-width: 680px;
    margin: 0 auto;
    padding: var(--space-3xl) var(--space-md) var(--space-2xl);
    text-align: center;
}
.hero h1 {
    font: 700 42px/1.1 var(--font-head);
    color: #fff;
    letter-spacing: -.02em;
    margin-bottom: 16px;
}
.hero p {
    font: 300 19px/1.55 var(--font-body);
    color: var(--fg-muted);
    max-width: 480px;
    margin: 0 auto;
}

/* ── About ── */
.about {
    max-width: 680px;
    margin: 0 auto;
    padding: 0 var(--space-md) var(--space-3xl);
}
.about h2 {
    font: 500 13px/1 var(--font-body);
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--fg-dim);
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
    margin-bottom: var(--space-md);
}
.about-text {
    font: 400 16px/1.8 var(--font-body);
    color: var(--fg-muted);
    white-space: pre-line;
}

/* ── Footer ── */
footer {
    max-width: 680px;
    margin: 0 auto;
    padding: var(--space-md) var(--space-md) var(--space-xl);
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--fg-dim);
    text-align: center;
}

/* ── Admin bar ── */
.admin-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--bg-raised);
    border-top: 1px solid var(--border);
    color: var(--fg);
    padding: 10px var(--space-md);
    display: none;
    align-items: center;
    gap: 12px;
    z-index: 100;
    font-size: 13px;
}
.admin-bar.visible { display: flex; }
.admin-bar button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 6px 14px;
    font: 500 13px/1 var(--font-body);
    cursor: pointer;
    transition: background 200ms ease;
}
.admin-bar button:hover { background: var(--accent-hover); }

/* ── Editable ── */
[contenteditable="true"] {
    outline: 2px dashed var(--accent);
    outline-offset: 6px;
    border-radius: 3px;
    min-height: 1.2em;
}
[contenteditable="true"]:focus {
    outline-color: var(--accent-hover);
    background: var(--accent-muted);
}

/* ── Service editor modal ── */
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 150; backdrop-filter: blur(4px); }
.overlay.open { display: block; }
.service-editor {
    display: none;
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: var(--space-lg);
    z-index: 200;
    width: 90%;
    max-width: 520px;
    box-shadow: var(--shadow-modal);
}
.service-editor.open { display: block; }
.service-editor h3 {
    font: 600 18px/1.3 var(--font-head);
    color: #fff;
    margin-bottom: var(--space-md);
}
.service-editor .svc-row {
    display: flex;
    gap: var(--space-sm);
    margin-bottom: 10px;
    align-items: center;
}
.service-editor input {
    flex: 1;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font: 14px var(--font-body);
    background: var(--bg);
    color: var(--fg);
    transition: border-color 200ms ease;
}
.service-editor input:focus { outline: none; border-color: var(--accent); }
.service-editor input::placeholder { color: var(--fg-dim); }
.service-editor .svc-remove {
    background: none; border: none;
    color: var(--fg-dim); font-size: 18px;
    cursor: pointer; padding: 0 4px;
    transition: color 200ms ease;
}
.service-editor .svc-remove:hover { color: #e54d42; }
.service-editor .svc-actions { display: flex; gap: var(--space-sm); margin-top: var(--space-md); }
.service-editor .btn-add-svc {
    background: none;
    border: 1px dashed var(--border);
    border-radius: 6px;
    padding: 8px;
    width: 100%;
    font: 13px var(--font-body);
    color: var(--fg-dim);
    cursor: pointer;
    transition: border-color 200ms ease, color 200ms ease;
}
.service-editor .btn-add-svc:hover { border-color: var(--accent); color: var(--accent); }
.btn-save {
    background: var(--accent); color: #fff; border: none;
    border-radius: 6px; padding: 9px 20px;
    font: 500 14px var(--font-body); cursor: pointer;
    transition: background 200ms ease;
}
.btn-save:hover { background: var(--accent-hover); }
.btn-cancel {
    background: var(--bg); color: var(--fg-muted);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 9px 20px; font: 14px var(--font-body);
    cursor: pointer; transition: border-color 200ms ease;
}
.btn-cancel:hover { border-color: var(--fg-dim); }

/* ── Responsive ── */
@media (max-width: 600px) {
    .banner-inner { flex-direction: column; }
    .service-card { border-right: none; border-bottom: 1px solid var(--border); padding: 20px; }
    .service-card:last-child { border-bottom: none; }
    .hero { padding: var(--space-xl) 20px var(--space-lg); }
    .hero h1 { font-size: 30px; }
    .hero p { font-size: 17px; }
    .about { padding: 0 20px var(--space-xl); }
}
    </style>
</head>
<body>

<div class="banner" id="banner">
    <div class="banner-inner" id="services-banner"></div>
</div>

<section class="hero">
    <h1 id="hero-title"></h1>
    <p id="hero-subtitle"></p>
</section>

<section class="about">
    <h2 id="about-title"></h2>
    <div class="about-text" id="about-text"></div>
</section>

<footer id="footer-text"></footer>

<div class="admin-bar" id="admin-bar">
    <span>Admin</span>
    <button id="btn-edit-services">Services</button>
    <button id="btn-save-all">Enregistrer</button>
    <span style="flex:1"></span>
    <span id="save-status" style="opacity:.7"></span>
</div>

<div class="overlay" id="overlay"></div>
<div class="service-editor" id="service-editor">
    <h3>Services</h3>
    <div id="svc-list"></div>
    <button class="btn-add-svc" id="btn-add-svc">+ Ajouter un service</button>
    <div class="svc-actions">
        <button class="btn-save" id="svc-save">Appliquer</button>
        <button class="btn-cancel" id="svc-cancel">Annuler</button>
    </div>
</div>

<script>
'use strict';

const esc = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };
const $ = s => document.querySelector(s);

const API = window.__HUB_API || 'https://hr-hub.duckdns.org';

let content = {};
let isAdmin = false;
let adminToken = '';
let editServices = [];

async function init() {
    const params = new URLSearchParams(location.search);
    adminToken = params.get('admin') || '';

    if (adminToken) {
        const res = await fetch(`${API}/api/site/admin-check?token=${encodeURIComponent(adminToken)}`);
        const d = await res.json();
        isAdmin = d.admin;
    }

    const res = await fetch(`${API}/api/site/content`);
    content = await res.json();
    render();

    if (isAdmin) enableAdmin();
}

function render() {
    renderServices();
    $('#hero-title').textContent = content.hero_title || '';
    $('#hero-subtitle').textContent = content.hero_subtitle || '';
    $('#about-title').textContent = content.about_title || '';
    $('#about-text').textContent = content.about_text || '';
    $('#footer-text').textContent = content.footer_text || '';
}

function renderServices() {
    const c = $('#services-banner');
    const svcs = content.services || [];
    c.innerHTML = svcs.map(s =>
        `<div class="service-card"><h3>${esc(s.title)}</h3><p>${esc(s.desc)}</p></div>`
    ).join('');
}

function enableAdmin() {
    $('#admin-bar').classList.add('visible');
    document.body.style.paddingBottom = '52px';

    const editables = ['hero-title', 'hero-subtitle', 'about-title', 'about-text', 'footer-text'];
    for (const id of editables) {
        $(`#${id}`).contentEditable = 'true';
    }

    $('#btn-save-all').addEventListener('click', saveAll);
    $('#btn-edit-services').addEventListener('click', openServiceEditor);
    $('#svc-save').addEventListener('click', applyServices);
    $('#svc-cancel').addEventListener('click', closeServiceEditor);
    $('#overlay').addEventListener('click', closeServiceEditor);
    $('#btn-add-svc').addEventListener('click', () => {
        editServices.push({ title: '', desc: '' });
        renderServiceEditor();
    });
}

async function saveAll() {
    content.hero_title = $('#hero-title').textContent.trim();
    content.hero_subtitle = $('#hero-subtitle').textContent.trim();
    content.about_title = $('#about-title').textContent.trim();
    content.about_text = $('#about-text').textContent.trim();
    content.footer_text = $('#footer-text').textContent.trim();

    $('#save-status').textContent = 'Enregistrement…';
    await fetch(`${API}/api/site/content`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'X-Admin-Token': adminToken },
        body: JSON.stringify(content),
    });
    $('#save-status').textContent = 'Enregistré';
    setTimeout(() => $('#save-status').textContent = '', 2000);
}

function openServiceEditor() {
    editServices = (content.services || []).map(s => ({ ...s }));
    renderServiceEditor();
    $('#service-editor').classList.add('open');
    $('#overlay').classList.add('open');
}

function closeServiceEditor() {
    $('#service-editor').classList.remove('open');
    $('#overlay').classList.remove('open');
}

function renderServiceEditor() {
    const list = $('#svc-list');
    list.innerHTML = editServices.map((s, i) => `
        <div class="svc-row">
            <input type="text" placeholder="Titre" value="${esc(s.title)}" data-svc-idx="${i}" data-svc-field="title">
            <input type="text" placeholder="Description" value="${esc(s.desc)}" data-svc-idx="${i}" data-svc-field="desc">
            <button class="svc-remove" data-svc-remove="${i}">&times;</button>
        </div>
    `).join('');

    for (const input of list.querySelectorAll('input')) {
        input.addEventListener('input', () => {
            const idx = parseInt(input.dataset.svcIdx);
            editServices[idx][input.dataset.svcField] = input.value;
        });
    }
    for (const btn of list.querySelectorAll('.svc-remove')) {
        btn.addEventListener('click', () => {
            editServices.splice(parseInt(btn.dataset.svcRemove), 1);
            renderServiceEditor();
        });
    }
}

function applyServices() {
    content.services = editServices.filter(s => s.title.trim() || s.desc.trim());
    renderServices();
    closeServiceEditor();
}

init();
</script>
</body>
</html>
